<header class="site-header">
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>
  <!-- Only shown (via JS) on pages that actually render a video background -
       lets visitors stop the looping background clips, for accessibility
       (respects prefers-reduced-motion by default too) and lighter/slower
       browsers. -->
  <button
    class="bg-toggle"
    id="bg-toggle"
    type="button"
    aria-label="Pause background videos"
    aria-pressed="false"
    hidden
  >
    <span class="bg-toggle__icon bg-toggle__icon--pause" aria-hidden="true"></span>
    <span class="bg-toggle__icon bg-toggle__icon--play" aria-hidden="true"></span>
  </button>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="/about/">About</a>
    <span class="nav-dot" aria-hidden="true">·</span>
    <a href="/photos/">Photography</a>
    <span class="nav-dot" aria-hidden="true">·</span>
    <a class="brand-link" href="/" aria-label="Home">
      <img src="/_resources/fc_logo.png" alt="FC" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" />
      <span class="brand-text" style="display:none">FC</span>
    </a>
    <span class="nav-dot" aria-hidden="true">·</span>
    <a href="/videos/">Videos</a>
    <span class="nav-dot" aria-hidden="true">·</span>
    <a href="/contact/">Contact</a>
  </nav>
</header>
